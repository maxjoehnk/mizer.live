<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

  <meta property="og:site_name" content="Mizer">
  <meta property="og:description" content="A visualization software for live events like concerts and club gigs with a node based workflow.">
  <meta property="og:image" content="https://mizer.live/assets/images/layout.png">
  <meta property="og:type" content="website">

  {{ favicons }}
  {% block head %}{% endblock %}
</head>
<body class="body no-script">
{% block page %}{% endblock %}
<script>
  document.body.classList.remove('noscript');
</script>
{% block footer %}{% endblock %}
</body>
</html>
